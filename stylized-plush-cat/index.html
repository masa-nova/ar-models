<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>stylized plush cat</title>
<meta name="description" content="stylized plush cat — スマホのカメラでARとして見られます。">
<meta property="og:title" content="stylized plush cat"><meta property="og:type" content="website">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
 :root{color-scheme:dark} *{box-sizing:border-box}
 body{margin:0;font:16px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
      background:#101114;color:#eceef2;display:flex;flex-direction:column;min-height:100dvh}
 header{padding:12px 16px 10px;display:flex;align-items:center;gap:10px}
 a.back{color:#8e939d;text-decoration:none;font-size:13px;white-space:nowrap}
 h1{margin:0;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#e8403a;color:#fff}
 .stage{position:relative;flex:1 1 auto;min-height:52vh}
 model-viewer{position:absolute;inset:0;width:100%;height:100%;background:#1b1d22}
 #ar{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);padding:14px 26px;border:0;
     border-radius:999px;font-size:16px;font-weight:700;background:#e8403a;color:#fff;
     box-shadow:0 6px 18px rgba(0,0,0,.45)}
 #arjump{display:none;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);padding:15px 32px;
     border:0;border-radius:999px;font-size:17px;font-weight:700;background:#e8403a;color:#fff;
     box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:3}
 model-viewer[ar-status="session-started"] #arjump{display:block}
 #hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;padding:7px 15px;
     border-radius:999px;font-size:12.5px;font-weight:600;background:rgba(0,0,0,.55);color:#fff;
     pointer-events:none;transition:opacity .5s}
 footer{padding:12px 16px 18px;font-size:12.5px;color:#8e939d}
 footer b{color:#c9ced8;font-weight:600}
</style></head><body>
<header><a class="back" href="../">← 一覧</a><h1>stylized plush cat</h1><span class="tag">キャラクター</span></header>
<div class="stage">
<model-viewer id="mv" src="model.glb" alt="stylized plush cat" poster="thumb.webp" ar ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto" ar-placement="floor" camera-controls animation-name="float"
  shadow-intensity="1" environment-image="neutral" exposure="1">
  <button id="ar" slot="ar-button">スマホで AR 表示</button>
  <button id="arjump" type="button">ジャンプ！</button>
</model-viewer>
<div id="hint">ふわふわ浮いています。タップすると跳ねます</div>
</div>
<footer><b>スマホで開くと</b>赤い「AR 表示」ボタンが出ます（Android は Chrome、iPhone は Safari）。<br>
パソコンでは AR ボタンは出ません（3D の回転表示のみ）。</footer>
<script>
 const mv=document.getElementById('mv'),hint=document.getElementById('hint');
 let jumping=false,timer=null;
 function toFloat(){jumping=false;if(timer){clearTimeout(timer);timer=null;}
   mv.animationName='float';mv.currentTime=0;mv.play();}
 function jump(){if(jumping||!mv.loaded)return;jumping=true;if(hint)hint.style.opacity='0';
   mv.animationName='jump';mv.currentTime=0;mv.play({repetitions:1});
   requestAnimationFrame(function(){var ms=((mv.duration||0.9)*1000)+80;
     if(timer)clearTimeout(timer);timer=setTimeout(toFloat,ms);});}
 mv.addEventListener('load',toFloat); mv.addEventListener('finished',toFloat);
 document.getElementById('arjump').addEventListener('click',function(e){e.stopPropagation();jump();});
 var sx=0,sy=0,st=0;
 mv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;st=Date.now();});
 mv.addEventListener('pointerup',function(e){
   if(Math.hypot(e.clientX-sx,e.clientY-sy)<10&&Date.now()-st<500)jump();});
</script></body></html>
