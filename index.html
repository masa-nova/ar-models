<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レトロ ガムボールマシン ロボット</title>
<meta name="description" content="スマホのカメラで実物大のガムボールマシン・ロボットをその場に出せます。">
<meta property="og:title" content="レトロ ガムボールマシン ロボット">
<meta property="og:description" content="スマホのカメラで実物大のロボットをその場に出せます。">
<meta property="og:type" content="website">
<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
         background:#101114; color:#eceef2; display:flex; flex-direction:column; min-height:100dvh; }
  header { padding:14px 16px 10px; }
  h1 { margin:0; font-size:17px; letter-spacing:.01em; }
  p.sub { margin:4px 0 0; font-size:12.5px; color:#8e939d; }
  model-viewer { flex:1; width:100%; min-height:48vh; background:#1b1d22; }
  #ar { position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
        padding:14px 26px; border:0; border-radius:999px; font-size:16px; font-weight:700;
        background:#e8403a; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.45); cursor:pointer; }
  footer { padding:12px 16px 18px; font-size:12.5px; color:#8e939d; }
  footer b { color:#c9ced8; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>レトロ ガムボールマシン ロボット</h1>
  <p class="sub">高さ 1m ／ ドラッグで回転・ピンチで拡大</p>
</header>

<model-viewer
  src="gumball-robot-ar.glb"
  alt="レトロなガムボールマシン型のロボット"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  ar-placement="floor"
  camera-controls
  auto-rotate
  auto-rotate-delay="1200"
  rotation-per-second="18deg"
  shadow-intensity="1"
  environment-image="neutral"
  exposure="1">
  <button id="ar" slot="ar-button">スマホで AR 表示</button>
</model-viewer>

<footer>
  <b>スマホで開くと</b>赤い「AR 表示」ボタンが出ます（Android は Chrome、iPhone は Safari）。<br>
  パソコンでは AR ボタンは出ません（3D の回転表示のみ）。
</footer>
</body>
</html>
