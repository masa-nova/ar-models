<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>レトロ ガムボールマシン ロボット</title>
<meta name="description" content="スマホのカメラで実物大のガムボールマシン・ロボットをその場に出せます。タップすると跳ねます。">
<meta property="og:title" content="レトロ ガムボールマシン ロボット">
<meta property="og:description" content="スマホのカメラで実物大のロボットを。タップすると跳ねます。">
<meta property="og:type" content="website">
<script type="module"
  src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
         background:#101114; color:#eceef2; display:flex; flex-direction:column; min-height:100dvh; }
  header { padding:14px 16px 10px; }
  h1 { margin:0; font-size:17px; }
  p.sub { margin:4px 0 0; font-size:12.5px; color:#8e939d; }
  .stage { position:relative; flex:1 1 auto; min-height:52vh; }
  model-viewer { position:absolute; inset:0; width:100%; height:100%; background:#1b1d22; --poster-color:transparent; }
  #ar { position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
        padding:14px 26px; border:0; border-radius:999px; font-size:16px; font-weight:700;
        background:#e8403a; color:#fff; box-shadow:0 6px 18px rgba(0,0,0,.45); cursor:pointer; }
  #hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:2;
          padding:7px 15px; border-radius:999px; font-size:12.5px; font-weight:600;
          background:rgba(0,0,0,.55); color:#fff; pointer-events:none;
          transition:opacity .5s; backdrop-filter:blur(4px); }
  footer { padding:12px 16px 18px; font-size:12.5px; color:#8e939d; }
  footer b { color:#c9ced8; font-weight:600; }
</style>
</head>
<body>
<header>
  <h1>レトロ ガムボールマシン ロボット</h1>
  <p class="sub">高さ 1m ／ ドラッグで回転・ピンチで拡大</p>
</header>

<div class="stage">
<model-viewer id="mv"
  src="gumball-robot-ar.glb"
  alt="レトロなガムボールマシン型のロボット"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  ar-placement="floor"
  camera-controls
  animation-name="float"
  shadow-intensity="1"
  environment-image="neutral"
  exposure="1">
  <button id="ar" slot="ar-button">スマホで AR 表示</button>
</model-viewer>
<div id="hint">ロボットをタップすると跳ねます</div>
</div>

<footer>
  <b>スマホで開くと</b>赤い「AR 表示」ボタンが出ます（Android は Chrome、iPhone は Safari）。<br>
  パソコンでは AR ボタンは出ません（3D の回転表示のみ）。
</footer>

<script>
  const mv   = document.getElementById('mv');
  const hint = document.getElementById('hint');
  let jumping = false;

  let timer = null;

  function toFloat() {
    jumping = false;
    if (timer) { clearTimeout(timer); timer = null; }
    mv.animationName = 'float';
    mv.currentTime = 0;
    mv.play();                         // 引数なし = 無限ループ
  }
  function jump() {
    if (jumping || !mv.loaded) return;
    jumping = true;
    if (hint) hint.style.opacity = '0';
    mv.animationName = 'jump';
    mv.currentTime = 0;
    mv.play({ repetitions: 1 });
    // finished イベントが来ない場合に備えて、尺ぶんの保険タイマーも張る
    requestAnimationFrame(() => {
      const ms = ((mv.duration || 0.9) * 1000) + 80;
      if (timer) clearTimeout(timer);
      timer = setTimeout(toFloat, ms);
    });
  }

  mv.addEventListener('load', toFloat);
  mv.addEventListener('finished', toFloat);

  // ドラッグ(回転操作)と区別して、その場タップのときだけ跳ねさせる
  let sx = 0, sy = 0, st = 0;
  mv.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = Date.now(); });
  mv.addEventListener('pointerup', e => {
    const moved = Math.hypot(e.clientX - sx, e.clientY - sy);
    if (moved < 10 && Date.now() - st < 500) jump();
  });
</script>
</body>
</html>
